# FancyMenu конфигурация для лаунчера «Егерь» (HAND-стиль, 1939)
# Поместите этот файл в .minecraft/config/fancymenu.cfg при запуске

background=assets/fancymenu/textures/background.png
background.scale=fit
background.brightness=0.85
background.blur=0

font.main=assets/fancymenu/fonts/RussoOne-Regular.ttf
font.main.size=44
font.main.color=#1C1B18

font.sub=assets/fancymenu/fonts/PTMono-Regular.ttf
font.sub.size=16
font.sub.color=#6E6B6A

buttons.style=hand
buttons.background=#A07C3C
buttons.text=#1C1B18
buttons.border=#1C1B18
buttons.border.width=2
buttons.border.type=torn

menu.title=МЕНЮ
menu.title.font=assets/fancymenu/fonts/RussoOne-Regular.ttf
menu.title.size=64
menu.title.color=#1C1B18
menu.title.y=120

button.play=Играть
button.multiplayer=Сервер
button.options=Настройки
button.quit=Выйти

button.play.y=260
button.multiplayer.y=300
button.options.y=340
button.quit.y=380

dynamic.elements=false
hand.style=true
theme.ink=true
theme.brass.accent=#A07C3C
