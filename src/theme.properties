# === Оформление лаунчера «Егерь» ===
# Этот файл лежит рядом с EgerLauncher.exe — правьте и перезапускайте, пересборка не нужна.
# Картинки: имя файла рядом с exe (например background.png), или ссылка http(s)://...
# Цвета: #RRGGBB или #RRGGBBAA (AA — прозрачность, 00..FF).

# Заголовок (пусто = project.name); {mc} в подзаголовке = версия Minecraft
title=
subtitle=ФРОНТОВОЙ СЕРВЕР · MINECRAFT {mc} · ТЕСТ

# Фон окна и его затемнение 0..1
background=background.png
background.dim=0.15
# Трафаретный логотип вместо текстового заголовка
logo=logo.png
logo.height=118
icon=icon.png

# Шрифт: Impact похож на армейский трафарет; свой .ttf можно положить рядом (font.file)
font=Impact
font.file=
# Шрифты ручного стиля: Russo One (заголовки) и PT Mono (текст), лежат в theme/fonts
font.display.file=fonts/RussoOne-Regular.ttf
font.body.file=fonts/PTMono-Regular.ttf
# Шрифт обычного текста (пусто = как font)
font.body=

window.width=920
window.height=560
# 2 = почти прямые углы, как у армейских ящиков
radius=2
# Ревизия внешней темы: файлы рядом с exe применяются только с revision >= 2
theme.revision=2
# Стиль по умолчанию: hand | clean | military | sketch
ui.style=hand
# Ассеты ручного стиля
hand.hero=hand-hero.png
hand.paper=paper.png
hand.icon=hand-icon.png

color.background=#2E3020
color.background2=#1C1D13
color.panel=#1A1B12E6
color.dialog=#22241A
color.field=#0F100A
color.accent=#7A6A2E
color.accent.hover=#968339
color.on.accent=#F1E8C4
color.text=#E4DCB6
color.muted=#A39B78
color.online=#8DB255
color.offline=#C0442E

# Палитра ручного стиля: бумага, тушь, латунь
color.hand.background=#C9C5B9
color.hand.background2=#A7A395
color.hand.panel=#E4E0D5
color.hand.dialog=#E4E0D5
color.hand.field=#E4E0D5
color.hand.accent=#A07C3C
color.hand.accent.hover=#C09A52
color.hand.on.accent=#14130F
color.hand.text=#1C1B18
color.hand.muted=#6A665B
color.hand.online=#A07C3C
color.hand.offline=#1C1B18
color.hand.ink.soft=#3B3933
color.hand.paper.shadow=#A7A395

links=
