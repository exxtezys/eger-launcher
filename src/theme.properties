# === Оформление лаунчера «Егерь» ===
# Этот файл лежит рядом с EgerLauncher.exe — правьте и перезапускайте, пересборка не нужна.
# Картинки: имя файла рядом с exe (например scene.png), или ссылка http(s)://...
# Цвета: #RRGGBB или #RRGGBBAA (AA — прозрачность, 00..FF).

# Заголовок (пусто = project.name); {mc} в подзаголовке = версия Minecraft
title=
subtitle=ОПЫТНАЯ ДЕГУСТАЦИОННАЯ СТАНЦИЯ · MINECRAFT {mc}

# Комната 1939 года: рисунок на весь экран, живые детали рисует Scene.java
scene=scene.png
background=
background.dim=0
logo=logo.png
logo.height=84
icon=icon.png

# Шрифты: Russo One (заголовки) и PT Mono (текст), лежат в theme/fonts
font.display.file=fonts/RussoOne-Regular.ttf
font.body.file=fonts/PTMono-Regular.ttf
font.body=

window.width=920
window.height=560
radius=2
# Ревизия внешней темы: файлы рядом с exe применяются только с revision >= 2
theme.revision=2
# Стиль: ручная бумага, тушь и латунь
ui.style=hand

# Палитра: тёплая бумага, чернила, сургуч и латунь
color.hand.background=#DCD3BC
color.hand.background2=#C7BCA2
color.hand.panel=#EDE4CE
color.hand.dialog=#EFE7D3
color.hand.field=#E8DEC8
color.hand.accent=#8B2E22
color.hand.accent.hover=#A63B2C
color.hand.on.accent=#F5EBD3
color.hand.text=#231F19
color.hand.muted=#6B6354
color.hand.online=#5D6B3E
color.hand.offline=#7C2A20
color.hand.ink.soft=#3B362C
color.hand.paper.shadow=#A99D82

links=
