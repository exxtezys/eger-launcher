# === Оформление лаунчера «Егерь» ===
# Этот файл лежит рядом с EgerLauncher.exe — правьте и перезапускайте, пересборка не нужна.
# Картинки: имя файла рядом с exe (например background.png), или ссылка http(s)://...
# Цвета: #RRGGBB или #RRGGBBAA (AA — прозрачность, 00..FF).

# Заголовок (пусто = project.name); {mc} в подзаголовке = версия Minecraft
title=
subtitle=ФРОНТОВОЙ СЕРВЕР · MINECRAFT {mc} · ТЕСТ

# Фон окна и его затемнение 0..1
background=background.png
background.dim=0.15
# Трафаретный логотип вместо текстового заголовка
logo=logo.png
logo.height=118
icon=icon.png

# Шрифт: Impact похож на армейский трафарет; свой .ttf можно положить рядом (font.file)
font=Impact
font.file=
# Шрифт обычного текста (пусто = как font)
font.body=Bahnschrift

window.width=920
window.height=560
# 2 = почти прямые углы, как у армейских ящиков
radius=2

color.background=#2E3020
color.background2=#1C1D13
color.panel=#1A1B12E6
color.dialog=#22241A
color.field=#0F100A
color.accent=#7A6A2E
color.accent.hover=#968339
color.on.accent=#F1E8C4
color.text=#E4DCB6
color.muted=#A39B78
color.online=#8DB255
color.offline=#C0442E

links=
