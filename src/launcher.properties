# === Настройки проекта (правятся ДО сборки) ===
project.name=Егерь
# папка игры в %APPDATA%
game.dir=.eger
minecraft.version=1.21.1
# конкретная версия (например 21.1.265) или latest
neoforge.version=21.1.252
# сервер для автоподключения и статуса (пусто = не подключаться)
server.host=khorn.tralala.club
server.port=25565
# ссылка на manifest.json модпака (раздаёт плагин ModpackServer на сервере)
modpack.url=http://ip-213-152-43-49.joinserver.xyz:25815/manifest.json
# Автообновление лаунчера: публичный GitHub-репозиторий owner/repo, берётся EliumLauncher.jar из последнего релиза
update.github=exxtezys/eger-launcher

# === Мод FancyMenu для внутриигрового меню ===
# Версия мода под Minecraft 1.21.1 (NeoForge)
mod.fancymenu.enabled=true
mod.fancymenu.version=26.1.2
mod.fancymenu.loader=neoforge
mod.fancymenu.jar.name=FancyMenu-26.1.2-1.21.1-neoforge.jar
mod.fancymenu.download.url=https://minecraft-inside.ru/download/539563/
